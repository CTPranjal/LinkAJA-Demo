name: LinkAJADemo
options:
  bundleIdPrefix: com.clevertap.demo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
targets:
  LinkAJADemo:
    type: application
    platform: iOS
    sources:
      - path: LinkAJADemo
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clevertap.demo.linkaja
        INFOPLIST_FILE: LinkAJADemo/Info.plist
        CODE_SIGN_ENTITLEMENTS: LinkAJADemo/LinkAJADemo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      testTargets:
        - LinkAJADemoTests
  LinkAJADemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LinkAJADemoTests
    dependencies:
      - target: LinkAJADemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clevertap.demo.linkaja.tests
        GENERATE_INFOPLIST_FILE: YES
